<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DefectShow Documentation</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        h1 { color: #2E8B57; }
        img { max-width: 600px; margin: 10px 0; border: 1px solid #ccc; }
        code { background-color: #eee; padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>DefectShow 使用手册</h1>

    <h2>功能介绍</h2>
    <ul>
        <li>打开图像文件</li>
        <li>加载缺陷 JSON</li>
        <li>高亮显示缺陷</li>
    </ul>

    <h2>示例截图</h2>
    <p>下图显示软件主界面：</p>
    <img src="https://250927defectshow-1258792233.cos.ap-beijing.myqcloud.com/app.png" alt="DefectShow 主界面">

    <h2>操作步骤</h2>
    <ol>
        <li>点击 <code>File -> Open Image</code> 打开图像</li>
        <li>点击 <code>File -> Open JSON</code> 导入缺陷信息</li>
        <li>在缺陷列表中选择缺陷查看高亮</li>
    </ol>

    <h2>注意事项</h2>
    <ul>
        <li>确保图像和 JSON 文件在项目目录中</li>
        <li>截图文件需放在 HTML 同级目录或指定路径</li>
    </ul>
</body>
</html>
